{% extends 'base.html' %}


{% block content %}
<div class="container mt-4">
    <h3>Your Scanned Expenses</h3>
    <table class="table table-hover mt-3">
        <thead class="table-dark">
            <tr>
                <th>Preview</th>
                <th>Merchant</th>
                <th>Amount</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            {% for expense in expenses %}
            <tr>
                <td><img src="{{ expense.receipt_image.url }}" style="width: 50px; border-radius: 4px;"></td>
                <td>{{ expense.merchant }}</td>
                <td>${{ expense.amount }}</td>
                <td>{{ expense.date|date:"M d, Y" }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="4" class="text-center">No receipts found. Start scanning!</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
